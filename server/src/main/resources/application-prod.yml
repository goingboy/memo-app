server:
  port: ${PORT:8080}

spring:
  application:
    name: memo-app-server
  datasource:
    url: jdbc:h2:file:./data/memo_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  timeout: 604800
  activity-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

app:
  admin-email: 13167000126@163.com
  upload:
    path: ./uploads
    max-file-size: 5242880
    allowed-types: image/jpeg,image/png,image/gif,image/webp

logging:
  level:
    root: INFO
    com.memo: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
